openapi: 3.0.3
info:
  title: EDO Platform API
  description: API платформы электронного документооборота
  version: 0.0.1

paths:
  /api/v1/documents:
    post:
      summary: Создать новый документ
      operationId: createDocument
      tags:
        - Document
      responses:
        '201':
          description: Документ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'

components:
  schemas:
    DocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PENDING_REVIEW
            - SIGNED
            - REJECTED
            - ARCHIVED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - createdAt
        - updatedAt